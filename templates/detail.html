<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app.nama }} - Download APK Gratis</title>
    <style>
        body { font-family: sans-serif; background: #fff; color: #333; line-height: 1.6; margin: 0; padding: 20px; }
        .content { max-width: 700px; margin: auto; border: 1px solid #eee; padding: 30px; border-radius: 15px; }
        .header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        .header img { width: 100px; height: 100px; border-radius: 20px; }
        .header h1 { margin: 0; font-size: 24px; }
        .btn-download { display: block; background: #1a73e8; color: white; text-align: center; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; margin: 20px 0; }
        .desc { background: #f9f9f9; padding: 15px; border-radius: 8px; font-size: 14px; }
        .meta { font-size: 13px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="content">
        <a href="/">← Kembali ke Home</a>
        <div class="header">
            <img src="{{ app.icon }}" alt="{{ app.nama }}" onerror="this.src='https://f-droid.org/repo/categories/Connectivity.png'">
            <div>
                <h1>{{ app.nama }}</h1>
                <div class="meta">Package: {{ app.pkg_name }}</div>
            </div>
        </div>
        
        <p><strong>Summary:</strong> {{ app.summary }}</p>

        <a href="https://f-droid.org/repo/{{ app.pkg_name }}_latest.apk" class="btn-download">
            DOWNLOAD LATEST APK
        </a>

        <h3>Deskripsi Aplikasi</h3>
        <div class="desc">
            {{ app.deskripsi | safe }}
        </div>
    </div>
</body>
</html>
